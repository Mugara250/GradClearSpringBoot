spring.application.name=GradClearSpringBoot
server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5439/gradclear_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# schema.sql isn't run automatically against an external database by default;
# this switches that on so the student_id_seq/staff_id_seq sequences get created.
spring.sql.init.mode=always
