spring.application.name=GradClearSpringBoot
server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5438/gradclear_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Docker Compose (compose.yaml: postgres, rabbitmq, mailhog). Always run
# `docker compose up` on startup, which only starts what isn't running yet
# (the default skips it entirely when any service is already up, so newly
# added services never started), and leave everything running on shutdown.
spring.docker.compose.start.skip=never
spring.docker.compose.lifecycle-management=start-only

# schema.sql isn't run automatically against an external database by default;
# this switches that on so the student_id_seq/staff_id_seq sequences get created.
spring.sql.init.mode=always

# --- Security / JWT -------------------------------------------------------
# HS256 signing key, >= 32 bytes. Set JWT_SECRET in every real environment;
# the fallback below is for local development only and is public.
gradclear.jwt.secret=${JWT_SECRET:dev-only-gradclear-jwt-secret-change-me-0123456789}
gradclear.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:24h}
gradclear.jwt.issuer=gradclear

# First-admin bootstrap (see AdminBootstrap): only used while the users table
# is empty, and only when GRADCLEAR_ADMIN_PASSWORD is set.
gradclear.bootstrap.admin-staff-id=${GRADCLEAR_ADMIN_STAFF_ID:STF-ADMIN-0001}
gradclear.bootstrap.admin-password=${GRADCLEAR_ADMIN_PASSWORD:}

# Auth is JWT-only; stop Boot creating an in-memory "user" with a generated password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Where OAuth2LoginSuccessHandler sends the browser after Google sign-in.
# Must match the frontend's callback route (frontend/src/config.ts CALLBACK_PATH).
gradclear.frontend-url=${FRONTEND_URL:http://localhost:5173}
gradclear.frontend-callback-path=/auth/callback

# The clearance Department whose officers act as the academic registrar and
# may record transcript results (TranscriptController POST/PUT). Matched by
# name, ignoring case.
gradclear.registrar-department=${GRADCLEAR_REGISTRAR_DEPARTMENT:Academic Registrar}

# --- Notifications (RabbitMQ -> email / SMS) --------------------------------
# RabbitMQ connection: started from compose.yaml and wired in automatically by
# spring-boot-docker-compose. Outside compose, set spring.rabbitmq.host/port/
# username/password (env SPRING_RABBITMQ_HOST etc.).
#
# A failing consumer retries 4 times with back-off (2s, 4s, 8s), then the
# message is rejected without requeue and lands in the queue's .dlq.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# SMTP for student emails. Defaults point at MailHog from compose.yaml (web
# inbox at http://localhost:8025). For real delivery, e.g. Gmail:
#   MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=you@gmail.com
#   MAIL_PASSWORD=<16-char app password> MAIL_SMTP_AUTH=true MAIL_SMTP_STARTTLS=true
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

gradclear.notifications.from=${GRADCLEAR_MAIL_FROM:GradClear <no-reply@gradclear.local>}
# prefix for local phone numbers (0788123456 -> +250788123456)
gradclear.notifications.default-country-code=${GRADCLEAR_DEFAULT_COUNTRY_CODE:+250}
