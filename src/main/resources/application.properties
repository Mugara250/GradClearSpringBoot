spring.application.name=GradClearSpringBoot
server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5438/gradclear_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# schema.sql isn't run automatically against an external database by default;
# this switches that on so the student_id_seq/staff_id_seq sequences get created.
spring.sql.init.mode=always

# --- Security / JWT -------------------------------------------------------
# HS256 signing key, >= 32 bytes. Set JWT_SECRET in every real environment;
# the fallback below is for local development only and is public.
gradclear.jwt.secret=${JWT_SECRET:dev-only-gradclear-jwt-secret-change-me-0123456789}
gradclear.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:24h}
gradclear.jwt.issuer=gradclear

# First-admin bootstrap (see AdminBootstrap): only used while the users table
# is empty, and only when GRADCLEAR_ADMIN_PASSWORD is set.
gradclear.bootstrap.admin-staff-id=${GRADCLEAR_ADMIN_STAFF_ID:STF-ADMIN-0001}
gradclear.bootstrap.admin-password=${GRADCLEAR_ADMIN_PASSWORD:}

# Auth is JWT-only; stop Boot creating an in-memory "user" with a generated password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Where OAuth2LoginSuccessHandler sends the browser after Google sign-in.
# Must match the frontend's callback route (frontend/src/config.ts CALLBACK_PATH).
gradclear.frontend-url=${FRONTEND_URL:http://localhost:5173}
gradclear.frontend-callback-path=/auth/callback
