services:
  postgres:
    image: 'postgres:16'
    container_name: gradclear-postgres
    environment:
      - 'POSTGRES_DB=gradclear_db'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5438:5432'
    volumes:
      - gradclear-db-data:/var/lib/postgresql/data

volumes:
  gradclear-db-data:
